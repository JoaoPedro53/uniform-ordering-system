name: Continous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - test
      - develop
jobs:
  continuos-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'Oracle'

      - name: install, build and test
        run: mvn clean package
